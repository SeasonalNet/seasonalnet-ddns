cloudflare:
  zone_name: seasonalnet.org
  api_token_env: CF_API_TOKEN

wan_ip:
  command: "curl -fsS https://api.ipify.org"
  interval_seconds: 600

wan_ipv6:
  # SeasonalWeb origin IPv6. The command must print exactly one global IPv6 address.
  command: "ip -6 -o addr show dev ens18 scope global | awk '!/temporary|deprecated/ { split($4,a,\"/\"); print a[1]; exit }'"

records:
  - name: pbx.seasonalnet.org
    type: A
    proxied: true

  - name: pbx.seasonalnet.org
    type: AAAA
    proxied: true

  - name: status.seasonalnet.org
    type: A
    proxied: true

  - name: status.seasonalnet.org
    type: AAAA
    proxied: true

  - name: www.seasonalnet.org
    type: A
    proxied: true

  - name: www.seasonalnet.org
    type: AAAA
    proxied: true

  - name: seasonalnet.org
    type: A
    proxied: true

  - name: seasonalnet.org
    type: AAAA
    proxied: true

  - name: radio.seasonalnet.org
    type: A
    proxied: true

  - name: radio.seasonalnet.org
    type: AAAA
    proxied: true

  - name: git.seasonalnet.org
    type: A
    proxied: true

  - name: git.seasonalnet.org
    type: AAAA
    proxied: true

  - name: prov.seasonalnet.org
    type: A
    proxied: true

  - name: prov.seasonalnet.org
    type: AAAA
    proxied: true

  - name: auth.seasonalnet.org
