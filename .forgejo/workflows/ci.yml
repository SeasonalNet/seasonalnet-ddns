name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: node24

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Enable pnpm
        run: |
          corepack enable
          node --version
          pnpm --version

      - name: Verify package metadata
        run: |
          node <<'NODE'
          const pkg = require("./package.json");

          if (pkg.packageManager !== "pnpm@11.17.0") {
            throw new Error(
              `expected packageManager pnpm@11.17.0, got ${pkg.packageManager}`
            );
          }

          console.log("package manager:", pkg.packageManager);
          NODE

          test -f pnpm-lock.yaml
          test ! -e package-lock.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify dependency policy
        run: pnpm ignored-builds

      - name: Prepare example config
        run: |
          if [ ! -f config.yaml ] && [ -f config.example.yaml ]; then
            cp config.example.yaml config.yaml
          fi

      - name: Check configuration
        run: pnpm check-config

      - name: Run tests
        run: pnpm test

      - name: Check JavaScript syntax
        run: |
          find src -type f -name '*.js' -print0 |
            xargs -0 -r -n1 node --check
