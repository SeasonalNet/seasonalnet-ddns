name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  version:
    name: Resolve and validate software version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      revision: ${{ steps.metadata.outputs.revision }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
      image_tag: ${{ steps.metadata.outputs.image_tag }}
      stable: ${{ steps.metadata.outputs.stable }}
    steps:
      - name: Check out complete Git history and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Test Git version resolution
        run: sh tools/test-version.sh
      - name: Resolve build identity and validate release tags
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$(sh tools/version.sh --release "$GITHUB_REF_NAME")"
            image_tag="$(sh tools/version.sh --image-tag "$GITHUB_REF_NAME")"
            stable="$(sh tools/version.sh --stable "$GITHUB_REF_NAME")"
          else
            version="$(sh tools/version.sh)"
            image_tag=""
            stable=false
          fi
          printf 'version=%s\nrevision=%s\ntimestamp=%s\nimage_tag=%s\nstable=%s\n' \
            "$version" "$(sh tools/version.sh --revision)" "$(sh tools/version.sh --timestamp)" \
            "$image_tag" "$stable" >> "$GITHUB_OUTPUT"

  node:
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      APP_REVISION: ${{ needs.version.outputs.revision }}
      APP_BUILD_DATE: ${{ needs.version.outputs.timestamp }}
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          node --version
          pnpm --version

      - name: Verify package metadata
        run: |
          node <<'NODE'
          const pkg = require("./package.json");

          if (pkg.packageManager !== "pnpm@12.15.0") {
            throw new Error(
              `expected packageManager pnpm@12.15.0, got ${pkg.packageManager}`
            );
          }

          console.log("package manager:", pkg.packageManager);
          NODE

          test -f pnpm-lock.yaml
          test ! -e package-lock.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit all dependency severities
        run: pnpm audit --audit-level low

      - name: Verify dependency policy
        run: pnpm ignored-builds

      - name: Prepare example config
        run: |
          if [ ! -f config.yaml ] && [ -f config.example.yaml ]; then
            cp config.example.yaml config.yaml
          fi

      - name: Check configuration
        run: pnpm check-config

      - name: Run tests
        run: pnpm test

      - name: Check JavaScript syntax
        run: |
          find src -type f -name '*.js' -print0 |
            xargs -0 -r -n1 node --check

  security:
    uses: ./.github/workflows/security.yml

  publish-container:
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      APP_REVISION: ${{ needs.version.outputs.revision }}
      APP_BUILD_DATE: ${{ needs.version.outputs.timestamp }}
      IMAGE_TAG: ${{ needs.version.outputs.image_tag }}
      IMAGE_STABLE: ${{ needs.version.outputs.stable }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [node, security, version]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Log in to GHCR
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          owner="$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')"
          repository="$(printf '%s' "$repository" | tr '[:upper:]' '[:lower:]')"
          publish() {
            local image="$1" dockerfile="$2" context="$3"
            local tags=(--tag "$image:sha-${GITHUB_SHA:0:12}")
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then
              tags+=(--tag "$image:latest")
            elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              tags+=(--tag "$image:$IMAGE_TAG")
              if [[ "$IMAGE_STABLE" == true ]]; then tags+=(--tag "$image:latest"); fi
            fi
            sh tools/build-image.sh --push "${tags[@]}" --file "$dockerfile" "$context"
          }
          publish "ghcr.io/$owner/seasonalnet-ddns" "Dockerfile" "."
